<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@zealakit/omniselect-vanilla</title>
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">@zealakit/omniselect-vanilla</p>
      <h1>NativeSelect</h1>
      <form id="form">
        <div class="field" id="fruit">
          <label for="fruit-select">Fruit</label>
          <select id="fruit-select" name="fruit" required>
            <option value="" disabled selected>Choose a fruit…</option>
            <option value="apple">Apple</option>
            <option value="banana">Banana</option>
            <option value="cherry">Cherry</option>
          </select>
          <span data-part="indicator">▾</span>
          <button type="submit">Submit</button>
        </div>
      </form>
      <p>Value: <span id="value">none</span></p>
      <pre id="submitted"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
